# Render Blueprint — provisions the database + web service in one shot.
#
# Quick start:
#   1. Push this file to GitHub (already done if you cloned this repo).
#   2. In Render dashboard: New + → Blueprint → connect this repo.
#   3. Render reads this file and creates the DB + web service automatically.
#   4. Wait for the build to finish. Then open a Shell on the web service and
#      run `npm run db:seed` once to load the sample product catalogue.
#   5. (Optional) In the web service's Environment tab, set CORS_ORIGIN to
#      your Render URL, e.g. https://mge-api.onrender.com
#
# Free tier notes:
#   - Web service spins down after 15 min of inactivity (cold-start ~30s).
#   - PostgreSQL free instance is deleted automatically after 90 days.

databases:
  - name: mge-db
    plan: free
    databaseName: mge_db
    user: mge_user
    region: oregon
    postgresMajorVersion: "16"

services:
  - type: web
    name: mge-api
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm install && npm run db:init
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mge-db
          property: connectionString
      - key: CORS_ORIGIN
        sync: false   # set this manually in the dashboard to your Render URL
